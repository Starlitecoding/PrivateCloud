networks:
  wan-net:
    driver: bridge
  lan-net:
    driver: bridge
    # internal: true
    ipam:
      config:
        - subnet: 10.10.10.0/24

services:
  mock-internet:
    image: nginx:alpine
    networks:
      - wan-net
    volumes:
      - ./gateway/mock-index.html:/usr/share/nginx/html/index.html:ro

  gateway:
    build: ./gateway
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      wan-net: {}
      lan-net:
        ipv4_address: 10.10.10.3

  # compute:
  #   build: ./compute
  #   cap_add:
  #     - NET_ADMIN
  #   networks:
  #     lan-net:
  #       ipv4_address: 10.10.10.11


  nginx:
   image: nginx:alpine
   ports:
    - "9999:80"
   volumes:
    - ./compute/nginx.conf:/etc/nginx/conf.d/default.conf:ro
   depends_on:
    - app1
    - app2
   networks:
     lan-net:
        ipv4_address: 10.10.10.19

  app1:
    image: hashicorp/http-echo  
    command: ["-text=hello from app1"]
    networks:
        lan-net:
          ipv4_address: 10.10.10.21


  app2:
    image: hashicorp/http-echo
    command: ["-text=hello from app2"]
    networks:
        lan-net:
          ipv4_address: 10.10.10.22


  kopia-backup:
    image: kopia/kopia:latest
    container_name: kopia
    restart: unless-stopped
    environment:
      KOPIA_PASSWORD: "123123123" 
    command:
      - server
      - start
      - --address=0.0.0.0:51515
      - --insecure
      - --server-username=admin
      - --server-password=123123123
    ports:
      - "51515:51515"
    volumes:
      - kopia-config:/app/config
      - kopia-cache:/app/cache
      - kopia-logs:/app/logs
      - backup-data:/backup-data
    networks:
      - lan-net

  storage:
    image: minio/minio
    command: minio server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=123123123
    cap_add:
      - SYS_ADMIN
    networks:
      lan-net: 
        ipv4_address: 10.10.10.12
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data
    

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    networks:
      lan-net:
        ipv4_address: 10.10.10.30
    ports:
      - "8081:8080"


  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      lan-net:
        ipv4_address: 10.10.10.31
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor


  grafana:
    image: grafana/grafana:latest
    volumes:
    - grafana-data:/var/lib/grafana
    networks:
      lan-net:
        ipv4_address: 10.10.10.32
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  minio-data:
  kopia-config:
  kopia-cache:
  kopia-logs:
  backup-data:
  prometheus-data:
  grafana-data:



