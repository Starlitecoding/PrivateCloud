networks:
  wan-net:
    driver: bridge
  lan-net:
    driver: bridge
    # internal: true
    ipam:
      config:
        - subnet: 10.10.10.0/24

services:
  mock-internet:
    image: nginx:alpine
    networks:
      - wan-net
    volumes:
      - ./gateway/mock-index.html:/usr/share/nginx/html/index.html:ro

  gateway:
    build: ./gateway
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      wan-net: {}
      lan-net:
        ipv4_address: 10.10.10.2

  # compute:
  #   build: ./compute
  #   cap_add:
  #     - NET_ADMIN
  #   networks:
  #     lan-net:
  #       ipv4_address: 10.10.10.11


  nginx:
   image: nginx:alpine
   ports:
    - "9999:80"
   volumes:
    - ./compute/nginx.conf:/etc/nginx/conf.d/default.conf:ro
   depends_on:
    - app1
    - app2
   networks:
     lan-net:
        ipv4_address: 10.10.10.19

  app1:
    image: hashicorp/http-echo  
    command: ["-text=hello from app1"]
    networks:
        lan-net:
          ipv4_address: 10.10.10.21


  app2:
    image: hashicorp/http-echo
    command: ["-text=hello from app2"]
    networks:
        lan-net:
          ipv4_address: 10.10.10.22


  storage:
    image: minio/minio
    command: minio server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=123123123
    cap_add:
      - SYS_ADMIN
    networks:
      lan-net: 
        ipv4_address: 10.10.10.12
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data

volumes:
  minio-data:




